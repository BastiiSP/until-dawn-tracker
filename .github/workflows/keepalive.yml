name: Supabase Keepalive

on:
  schedule:
    - cron: '0 10 */4 * *'  # Every 4 days at 10:00 UTC (offset from Vercel cron)
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/keepalive")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Keepalive ping failed with status $STATUS"
            exit 1
          fi
